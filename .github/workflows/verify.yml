name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze_and_test:
    name: Static analysis & Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
